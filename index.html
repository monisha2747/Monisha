<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONISHA| Portfolio</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Outfit:wght@100;400;900&family=Space+Mono&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #080808;
            --accent: #d4af37;
            --text: #ffffff;
            --border: rgba(212, 175, 55, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            line-height: 1.4;
        }

        /* --- THE SEARCHLIGHT CURSOR --- */
        #cursor {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out;
        }

        #cursor-point {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10001;
            transform: translate(-50%, -50%);
        }

        /* --- BRUTALIST GRID NAVIGATION --- */
        nav {
            position: fixed;
            width: 100%;
            height: 80px;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            border-bottom: 1px solid var(--border);
            background: rgba(8, 8, 8, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .nav-box {
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid var(--border);
        }

        .nav-box:last-child {
            border-right: none;
        }

        .nav-logo {
            font-weight: 900;
            letter-spacing: 5px;
            font-size: 0.8rem;
            color: white;
            /* Change from purple to white */
            text-decoration: none;
            /* Remove default link underline */
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text);
            font-family: 'Space Mono';
            font-size: 0.65rem;
            margin: 0 15px;
            letter-spacing: 2px;
        }

        /* --- HERO --- */
        header {
            height: 100vh;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding: 0 5%;
        }

        .hero-title {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            line-height: 0.9;
        }

        .hero-title i {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            color: var(--accent);
        }

        /* --- BOUTIQUE WORK SECTION --- */
        .work-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--border);
        }

        .work-item {
            border-right: 1px solid var(--border);
            padding: 80px 40px;
            position: relative;
            overflow: hidden;
            transition: 0.5s ease;
        }

        .work-item:nth-child(even) {
            border-right: none;
        }

        .work-item:hover {
            background: rgba(212, 175, 55, 0.03);
        }

        .work-img {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            margin-bottom: 30px;
            filter: saturate(0);
            transition: 0.8s ease;
        }

        .work-item:hover .work-img {
            filter: saturate(1);
            transform: scale(0.98);
        }

        .work-info h3 {
            font-family: 'Space Mono';
            font-size: 0.7rem;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .work-info h2 {
            font-size: 2rem;
            font-weight: 400;
            text-transform: uppercase;
        }

        /* --- CONTACT MODULAR (Location Removed) --- */
        .contact-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 400px;
        }

        .contact-box {
            padding: 60px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .contact-box:last-child {
            border-right: none;
        }

        .contact-label {
            font-family: 'Space Mono';
            font-size: 0.6rem;
            color: var(--accent);
            margin-bottom: 40px;
        }

        .contact-link {
            font-size: 1.2rem;
            color: white;
            text-decoration: none;
            margin-bottom: 10px;
            display: block;
        }

        input {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border);
            color: white;
            padding: 10px 0;
            width: 100%;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {

            .work-grid,
            .contact-section,
            nav {
                grid-template-columns: 1fr;
            }

            .nav-box {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            header {
                height: auto;
                padding: 150px 5%;
            }

            #cursor,
            #cursor-point {
                display: none;
            }

            * {
                cursor: auto !important;
            }
        }
    </style>
</head>

<body>

    <div id="cursor"></div>
    <div id="cursor-point"></div>

    <nav>
        <div class="nav-box">
            <a href="Index.html" class="nav-logo">MONISHA / HOME </a>
        </div>
        <div class="nav-box nav-links">
            <a href="../About/index.html">About</a>
            <a href="../Project/index.html">Projects</a>
            <a href="../Contact/index.html">Contact</a>
        </div>
    </nav>

    <header>
        <h1 class="hero-title">NICE TO MEET <i>YOU</i>.</h1>
    </header>

    <script>
        const cursor = document.getElementById('cursor');
        const point = document.getElementById('cursor-point');

        document.addEventListener('mousemove', (e) => {
            const { clientX: x, clientY: y } = e;
            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';
            point.style.left = x + 'px';
            point.style.top = y + 'px';
        });

        const hoverables = document.querySelectorAll('a, button, .work-item');
        hoverables.forEach(item => {
            item.addEventListener('mouseenter', () => {
                point.style.transform = 'translate(-50%, -50%) scale(4)';
                point.style.background = 'transparent';
                point.style.border = '1px solid #d4af37';
            });
            item.addEventListener('mouseleave', () => {
                point.style.transform = 'translate(-50%, -50%) scale(1)';
                point.style.background = '#d4af37';
                point.style.border = 'none';
            });
        });
    </script>
</body>

</html>
